[project]
name = "spotify-manager"
version = "0.1.0"
description = ""
authors = [{ name = "Uriel Fiori", email = "u.fiori@iib-institut.de" }]
requires-python = ">=3.14"
dependencies = [
    "spotipy>=2.24.0",
    "unidecode>=1.3.8",
    "pyuca>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0.1",
    "requests>=2.32",
    "rich>=15.0.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface-hub>=1.2",
    "httpx>=0.27",
]

[project.scripts]
spotify-manager = "spotify_manager.main:app"
spotify-api = "spotify_manager.api:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotify_manager"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-random-order>=1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, A: builtins, N: pep8-naming, D: pydocstyle
select = ["E", "W", "F", "I", "UP", "B", "A", "N", "D"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "E203", # whitespace before ':' (black/ruff-formatter compatible)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses Depends()/Query() etc. as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["spotify_manager"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
disallow_untyped_defs = true
warn_redundant_casts = true
# tests/ mirror the package layout (tests/loaders_savers, ...); these flags let
# mypy resolve both without the "duplicate module" / "found twice" errors.
explicit_package_bases = true
namespace_packages = true

# These installed SDKs do not publish type information. Keep their dynamic
# values at concrete integration and compatibility edges.
[[tool.mypy.overrides]]
module = ["spotipy.*", "pyuca.*"]
ignore_missing_imports = true

# The default package check must protect the business layers as strictly as the
# focused recipes, including Any accidentally inherited from an untyped import.
[[tool.mypy.overrides]]
module = ["spotify_manager.domain.*", "spotify_manager.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
disallow_any_explicit = true
disallow_any_unimported = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
