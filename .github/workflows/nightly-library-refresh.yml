name: Nightly library refresh

on:
  schedule:
    # Incremental: 23:17 Berlin in winter, 00:17 in summer, Sunday-Friday.
    - cron: "17 22 * * 0-5"
    # Full rebuild: Saturday night at 23:37 in winter, 00:37 in summer.
    - cron: "37 22 * * 6"
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify access without starting refresh jobs
        required: false
        default: false
        type: boolean
      full_rebuild:
        description: Fully rebuild all Spotify mirrors
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-library-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SPACE_URL: https://cyborg-nomade-spotify-manager.hf.space
      HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      SCHEDULED_ARG: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
    steps:
      - name: Check out the automation client
        uses: actions/checkout@v7

      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Space automation access
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: python .github/scripts/nightly_refresh.py --check-only

      - name: Refresh recent durable library data
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 22 * * 0-5') || (github.event_name == 'workflow_dispatch' && !inputs.check_only && !inputs.full_rebuild) }}
        run: python .github/scripts/nightly_refresh.py $SCHEDULED_ARG

      - name: Fully rebuild durable library data
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '37 22 * * 6') || (github.event_name == 'workflow_dispatch' && !inputs.check_only && inputs.full_rebuild) }}
        run: python .github/scripts/nightly_refresh.py $SCHEDULED_ARG --full-rebuild
