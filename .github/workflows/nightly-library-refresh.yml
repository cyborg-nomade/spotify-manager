name: Nightly library refresh

on:
  schedule:
    # Early probes compensate for GitHub occasionally delaying schedules by hours.
    # They exit harmlessly when they arrive before the 22:00 maintenance window.
    - cron: "17 19 * * 0-5"
      timezone: "Europe/Berlin"
    - cron: "37 19 * * 6"
      timezone: "Europe/Berlin"
    # Primary incremental runs: Monday-Saturday at 00:17 Berlin.
    - cron: "17 0 * * 1-6"
      timezone: "Europe/Berlin"
    # Primary weekly full rebuild: Sunday at 00:37 Berlin.
    - cron: "37 0 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify access without starting refresh jobs
        required: false
        default: false
        type: boolean
      full_rebuild:
        description: Fully rebuild all Spotify mirrors
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-library-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SPACE_URL: https://cyborg-nomade-spotify-manager.hf.space
      HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      SCHEDULED_ARG: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
    steps:
      - name: Check out the automation client
        uses: actions/checkout@v7

      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Space automation access
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: python .github/scripts/nightly_refresh.py --check-only

      - name: Refresh recent durable library data
        if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '17 19 * * 0-5' || github.event.schedule == '17 0 * * 1-6')) || (github.event_name == 'workflow_dispatch' && !inputs.check_only && !inputs.full_rebuild) }}
        run: python .github/scripts/nightly_refresh.py $SCHEDULED_ARG

      - name: Fully rebuild durable library data
        if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '37 19 * * 6' || github.event.schedule == '37 0 * * 0')) || (github.event_name == 'workflow_dispatch' && !inputs.check_only && inputs.full_rebuild) }}
        run: python .github/scripts/nightly_refresh.py $SCHEDULED_ARG --full-rebuild
