name: Nightly library refresh

on:
  schedule:
    # 23:17 Europe/Berlin in winter, 00:17 in summer. The client stops at 05:00.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify access without starting refresh jobs
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-library-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SPACE_URL: https://cyborg-nomade-spotify-manager.hf.space
      HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - name: Check out the automation client
        uses: actions/checkout@v7

      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Space automation access
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: python .github/scripts/nightly_refresh.py --check-only

      - name: Refresh durable library data
        if: ${{ github.event_name == 'schedule' || ! inputs.check_only }}
        run: python .github/scripts/nightly_refresh.py
